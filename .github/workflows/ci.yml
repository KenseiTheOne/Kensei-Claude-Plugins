name: CI

# Every check lives in scripts/check.sh; the jobs only provide the tools it needs.

on:
  push:
    branches: [main]
    tags: ["*--v*"]
  pull_request:

permissions:
  contents: read

env:
  # The Claude Code version the plugins were last validated with locally (`claude --version`).
  CLAUDE_CODE_VERSION: "2.1.286"

jobs:
  tests:
    name: Script tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"  # the oldest Python the README promises
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: scripts/check.sh tests

  validate:
    name: Manifests and frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code and PyYAML
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          python3 -m pip install --quiet pyyaml
      - run: scripts/check.sh validate yaml
      - name: Release tag matches plugin.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%--v*}"
          want="${tag##*--v}"
          have=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "plugins/$plugin/.claude-plugin/plugin.json")
          echo "$plugin: tag $want, plugin.json $have"
          test "$want" = "$have"
