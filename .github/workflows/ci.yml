name: CI

on:
  push:
    branches: [main]
    tags: ["*--v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: guard (ticket)
        working-directory: plugins/kensei-toolkit/skills/ticket
        run: python3 guard_test.py
      - name: diff-tour
        working-directory: plugins/kensei-toolkit/skills/diff-tour
        run: python3 difftour_test.py
      - name: statusline
        working-directory: plugins/kensei-statusline/scripts
        run: python3 statusline_test.py

  validate:
    name: Manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate --strict
        run: |
          claude --version
          claude plugin validate --strict .
          for p in plugins/*/; do
            claude plugin validate --strict "$p"
            claude plugin validate --strict "${p}skills"
          done
      - name: Frontmatter parses as strict YAML
        # Claude Code tolerates some invalid YAML (e.g. ": " inside a plain scalar); other tools do not.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob("plugins/*/skills/*/SKILL.md") + glob.glob("plugins/*/evals/*/prompt.md")
                            + glob.glob("plugins/*/evals/*/graders/*.md")):
              text = open(path, encoding="utf-8").read()
              try:
                  _, front, _ = text.split("---\n", 2)
                  assert isinstance(yaml.safe_load(front), dict)
              except Exception as error:
                  bad += 1
                  print(f"{path}: {error}")
          sys.exit(1 if bad else 0)
          EOF
      - name: Release tag matches plugin.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%--v*}"
          want="${tag##*--v}"
          have=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "plugins/$plugin/.claude-plugin/plugin.json")
          echo "$plugin: tag $want, plugin.json $have"
          test "$want" = "$have"
