<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title><!-- TITLE --></title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --panel: #f6f8fa;
    --add-bg: #dafbe1;
    --add-gutter: #aceebb;
    --add-num: #1a7f37;
    --del-bg: #ffebe9;
    --del-gutter: #ffcecb;
    --del-num: #cf222e;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #7d8590;
      --border: #30363d;
      --panel: #161b22;
      --add-bg: #033a16;
      --add-gutter: #0f5323;
      --add-num: #3fb950;
      --del-bg: #67060c;
      --del-gutter: #8e1519;
      --del-num: #f85149;
    }
  }

  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 24px;
    line-height: 1.5;
  }
  h1 { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  h2 { margin-top: 32px; }

  /* ---------- per-file <details> wrapper ---------- */
  details.file { margin: 0 0 24px 0; }
  details.file .diff,
  details.file .split { margin-bottom: 0; }

  summary.filename,
  .filename {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel);
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    color: var(--muted);
  }
  summary.filename {
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    list-style: none;
  }
  summary.filename::-webkit-details-marker { display: none; }
  summary.filename::marker { content: ""; }
  summary.filename::before {
    content: "▾";
    font-size: 10px;
    color: var(--muted);
    transition: transform 0.1s;
    flex-shrink: 0;
    margin-right: 4px;
  }
  details.file:not([open]) > summary.filename {
    border-bottom: 1px solid var(--border);
    border-radius: 6px;
  }
  details.file:not([open]) > summary.filename::before {
    transform: rotate(-90deg);
  }
  summary.filename .path {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--fg);
    font-weight: 500;
  }

  /* +X / −Y counts (reused in summary + file index) */
  .counts {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .counts .add { color: var(--add-num); }
  .counts .del { color: var(--del-num); margin-left: 6px; }

  /* ---------- "Files changed" inline total ---------- */
  .stats-total {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    margin-left: 10px;
  }
  .stats-total .add { color: var(--add-num); }
  .stats-total .del { color: var(--del-num); margin-left: 6px; }

  /* ---------- file index ---------- */
  details.file-index {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    margin: 0 0 20px 0;
    font-size: 13px;
  }
  details.file-index > summary {
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    color: var(--fg);
    padding: 4px 0;
    list-style: none;
  }
  details.file-index > summary::-webkit-details-marker { display: none; }
  details.file-index > summary::marker { content: ""; }
  details.file-index > summary::before {
    content: "▾";
    display: inline-block;
    margin-right: 8px;
    font-size: 10px;
    color: var(--muted);
    transition: transform 0.1s;
  }
  details.file-index:not([open]) > summary::before {
    transform: rotate(-90deg);
  }
  .file-index-list {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .file-index-list a {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 6px;
    border-radius: 4px;
    color: var(--fg);
    text-decoration: none;
  }
  .file-index-list a:hover {
    background: rgba(127, 127, 127, 0.12);
    text-decoration: none;
  }
  .file-index-list .path {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .diff {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0 0 6px 6px;
    margin: 0 0 24px 0;
    counter-reset: old new;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 50px 50px 1fr;
    white-space: pre;
    font-family: var(--mono);
  }
  .row .num {
    color: var(--muted);
    text-align: right;
    padding: 0 10px 0 0;
    user-select: none;
    -webkit-user-select: none;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  .row .num.old::before { content: counter(old); }
  .row .num.new::before { content: counter(new); }
  .row .code { padding: 0 10px; }

  .row.ctx { counter-increment: old new; }

  .row.add { background: var(--add-bg); counter-increment: new; }
  .row.add .num { background: var(--add-gutter); color: var(--add-num); }
  .row.add .num.old::before { content: ""; }

  .row.del { background: var(--del-bg); counter-increment: old; }
  .row.del .num { background: var(--del-gutter); color: var(--del-num); }
  .row.del .num.new::before { content: ""; }

  .split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 6px 6px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .split .side {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg);
    counter-reset: n;
    overflow-x: auto;
  }
  .split .side .side-body {
    min-width: max-content;
  }
  .split .side .srow {
    display: grid;
    grid-template-columns: 50px 1fr;
    white-space: pre;
  }
  .split .side .srow .num {
    color: var(--muted);
    text-align: right;
    padding: 0 10px 0 0;
    user-select: none;
    -webkit-user-select: none;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  .split .side .srow .num::before { counter-increment: n; content: counter(n); }
  .split .side .srow.blank .num::before { content: ""; counter-increment: none; }
  .split .side .srow.blank { background: var(--panel); }
  .split .side .srow.blank .code { opacity: 0.4; }
  .split .side .srow.add { background: var(--add-bg); }
  .split .side .srow.add .num { background: var(--add-gutter); color: var(--add-num); }
  .split .side .srow.del { background: var(--del-bg); }
  .split .side .srow.del .num { background: var(--del-gutter); color: var(--del-num); }
  .split .side .srow .code { padding: 0 10px; }
  .split .side .sheader {
    padding: 6px 12px;
    font-size: 11px;
    color: var(--muted);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-sizing: border-box;
  }

  .note {
    background: var(--panel);
    border-left: 3px solid var(--muted);
    padding: 10px 14px;
    font-size: 14px;
    margin: 12px 0 24px;
  }
  ul.tests { background: var(--panel); padding: 12px 16px 12px 36px; border-radius: 6px; }

  .view-radio { position: absolute; opacity: 0; pointer-events: none; }
  .view-toggle {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
    margin: 0 0 20px 0;
    gap: 2px;
    font-size: 13px;
    font-weight: 500;
  }
  .view-toggle label {
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--muted);
    user-select: none;
    transition: background 0.1s, color 0.1s;
  }
  .view-toggle label:hover { color: var(--fg); }
  #view-unified:checked ~ .view-toggle label[for="view-unified"],
  #view-split:checked ~ .view-toggle label[for="view-split"] {
    background: var(--bg);
    color: var(--fg);
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  @media (prefers-color-scheme: dark) {
    #view-unified:checked ~ .view-toggle label[for="view-unified"],
    #view-split:checked ~ .view-toggle label[for="view-split"] {
      background: #30363d;
      box-shadow: none;
    }
  }
  #view-unified:checked ~ .files .mode-split { display: none; }
  #view-split:checked ~ .files .mode-unified { display: none; }

  /* ---------- soft-wrap toggle ---------- */
  .wrap-toggle {
    display: inline-flex;
    align-items: center;
    margin: 0 0 20px 12px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .wrap-toggle::before {
    content: "";
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    margin-right: 8px;
    transition: background 0.1s, border-color 0.1s;
  }
  .wrap-toggle:hover::before { border-color: var(--fg); }
  #wrap-lines:checked ~ .wrap-toggle::before {
    background: var(--add-num);
    border-color: var(--add-num);
    box-shadow: inset 0 0 0 2px var(--bg);
  }
  #wrap-lines:checked ~ .wrap-toggle { color: var(--fg); }
  #wrap-lines:checked ~ .files .row,
  #wrap-lines:checked ~ .files .srow {
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---------- image diff ---------- */
  .image-diff {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0 0 6px 6px;
    padding: 12px;
  }
  .image-diff figure { margin: 0; text-align: center; }
  .image-diff figcaption {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .image-diff img {
    max-width: 100%;
    max-height: 480px;
    border: 1px solid var(--border);
    background:
      linear-gradient(45deg, #ccc 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(-45deg, #ccc 25%, transparent 25%) 0 8px/16px 16px,
      linear-gradient(45deg, transparent 75%, #ccc 75%) 8px -8px/16px 16px,
      linear-gradient(-45deg, transparent 75%, #ccc 75%) -8px 0/16px 16px;
  }

  /* ---------- print ---------- */
  @media print {
    body { max-width: none; margin: 0; padding: 12px; color: #000; background: #fff; }
    .view-toggle, .wrap-toggle, .view-radio { display: none !important; }
    .mode-split { display: none !important; }
    .mode-unified { display: block !important; }
    details, details.file, details.file-index { /* forced open via JS beforeprint hook */ }
    summary.filename::before, details.file-index > summary::before { display: none; }
    a { color: inherit; text-decoration: none; }
    .row, .srow { page-break-inside: avoid; }
    details.file { page-break-inside: avoid; }
  }
</style>
</head>
<body>

<h1><!-- TITLE --></h1>

<h2>Summary</h2>
<!-- SUMMARY -->

<h2>Changes</h2>
<ul>
  <!-- CHANGES -->
</ul>

<h2>Files changed <span class="stats-total"><!-- STATS_TOTAL --></span></h2>

<!-- FILE_INDEX -->

<input type="radio" name="view" id="view-unified" class="view-radio" checked>
<input type="radio" name="view" id="view-split" class="view-radio">
<input type="checkbox" id="wrap-lines" class="view-radio">

<div class="view-toggle">
  <label for="view-unified">Unified</label>
  <label for="view-split">Split</label>
</div>
<label for="wrap-lines" class="wrap-toggle">Soft-wrap long lines</label>

<div class="files">
  <!-- FILES -->
</div>

<h2>Test plan</h2>
<ul class="tests">
  <!-- TESTS -->
</ul>

<!-- NOTES_SECTION -->

<script>
  // Expand every <details> for printing so collapsed files aren't lost in the PDF.
  // Restore prior state after print dialog closes.
  (function () {
    var saved = null;
    window.addEventListener('beforeprint', function () {
      var els = document.querySelectorAll('details');
      saved = Array.prototype.map.call(els, function (d) { return d.open; });
      els.forEach(function (d) { d.open = true; });
    });
    window.addEventListener('afterprint', function () {
      if (!saved) return;
      var els = document.querySelectorAll('details');
      els.forEach(function (d, i) { d.open = saved[i]; });
      saved = null;
    });
  })();
</script>

</body>
</html>
